name: Rust release

# Release pipeline of the Rust port (rust/PLAN.md section 8), adapted from
# nyxmon's agent-rs-release.yml.
#
# - Tag `rs-v<semver>`: the tag must equal the mailgun-relay crate version;
#   tests, a glibc build on ubuntu-22.04 (glibc 2.35), the GLIBC floor check,
#   a `--version` and `--check-config` smoke test and the archive + sha256
#   file, then a GitHub release with both files.
# - workflow_dispatch: the same build and checks, uploaded as a workflow
#   artifact only (no release, no tag check).
#
# No cargo cache: release builds start from a clean state. Only the release
# job gets `contents: write`.

on:
  push:
    tags:
      - "rs-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check (x86_64-unknown-linux-gnu, glibc 2.35)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        # An explicit bash adds `-o pipefail`: a failing check piped into
        # `tee` still fails the step.
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-unknown-linux-gnu
      GLIBC_FLOOR: "2.35"
      # Embedded into `mailgun-relay --version` by rust/build.rs.
      MAILGUN_RELAY_GIT_COMMIT: ${{ github.sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.pack.outputs.archive }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap patched Rustup with verified OS trust
        working-directory: .
        run: python3 scripts/ci_rustup.py
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          python3 --version
          objdump --version | head -n 1
      - name: Check the version (tag must equal the crate version)
        id: version
        run: |
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/metadata.json"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python3 -I scripts/release_checks.py version --metadata "$RUNNER_TEMP/metadata.json" --tag "$GITHUB_REF_NAME")
          else
            version=$(python3 -I scripts/release_checks.py version --metadata "$RUNNER_TEMP/metadata.json")
          fi
          echo "mailgun-relay version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Format (cargo fmt)
        run: cargo fmt --check
      - name: Lint (cargo clippy)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (cargo test)
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked --target "$TARGET"
      - name: GLIBC floor and linked libraries
        run: |
          python3 -I scripts/release_checks.py glibc-floor --max "$GLIBC_FLOOR" "target/$TARGET/release/mailgun-relay" \
            | tee -a "$RUNNER_TEMP/checks.log"
      - name: Smoke test (--version names version and commit, --check-config passes)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -I scripts/release_checks.py smoke --binary "target/$TARGET/release/mailgun-relay" --version "$VERSION" --commit "$GITHUB_SHA" \
            | tee -a "$RUNNER_TEMP/checks.log"
      - name: Pack archive and checksum
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          archive=$(python3 -I scripts/release_checks.py pack \
            --binary "target/$TARGET/release/mailgun-relay" --license ../LICENSE \
            --version "$VERSION" --target "$TARGET" \
            --mtime "$(git log -1 --format=%ct)" --out-dir "$dist")
          (cd "$dist" && sha256sum --check "${archive}.sha256")
          sha256=$(cut -d ' ' -f 1 "$dist/${archive}.sha256")
          size=$(stat -c %s "target/$TARGET/release/mailgun-relay")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          {
            echo "### mailgun-relay ${VERSION}"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- archive: \`${archive}\`"
            echo "- sha256: \`${sha256}\`"
            echo "- binary size: ${size} bytes"
            echo
            echo '```'
            cat "$RUNNER_TEMP/checks.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailgun-relay-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/dist/${{ steps.pack.outputs.archive }}
            ${{ runner.temp }}/dist/${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archive and checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mailgun-relay-${{ needs.build.outputs.version }}-x86_64-unknown-linux-gnu
          path: dist
      - name: Verify the checksum
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: cd dist && sha256sum --check "${ARCHIVE}.sha256"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          notes="mailgun-relay ${VERSION} (Rust port), built from ${GITHUB_SHA} for x86_64-unknown-linux-gnu (glibc >= 2.35).

          sha256 of ${ARCHIVE}: ${SHA256}"
          # A semver pre-release version (0.3.0-rc.1) becomes a GitHub pre-release.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/${ARCHIVE}" "dist/${ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "mailgun-relay ${VERSION}" --notes "$notes"
