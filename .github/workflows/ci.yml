name: CI

# Same checks as the README development quickstart, in check-only mode, plus
# the Rust port in rust/ (rust/README.md). Tests are self-contained (no SMTP
# server or Mailgun account), so no secrets are needed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON: "3.14"

jobs:
  python:
    name: Lint, typecheck and tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  rust:
    name: Rust port (fmt, clippy, deny, tests, release build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap patched Rustup with verified OS trust
        working-directory: .
        run: python3 scripts/ci_rustup.py
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Format (cargo fmt)
        run: cargo fmt --check
      - name: Lint (cargo clippy)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install cargo-deny (pinned release, sha256 checked)
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/${name}.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/${name}.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: Supply chain (cargo deny, rust/deny.toml)
        run: cargo deny --locked check
      - name: Set up uv (Python's parser for the MIME check)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Tests (cargo test) and the MIME check with Python's parser
        run: |
          dump="$RUNNER_TEMP/mime"
          mkdir -p "$dump"
          MIME_FIXTURE_DUMP="$dump" cargo test --locked
          uv run python fixtures/check_mime.py "$dump"
      - name: Release build
        run: cargo build --release --locked
      - name: Binary size
        run: |
          size=$(stat -c %s target/release/mailgun-relay)
          echo "mailgun-relay release binary: ${size} bytes"
          echo "mailgun-relay release binary: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

  parity:
    # rust/PLAN.md 7.4: both implementations as real processes, the same
    # requests, compared by the parity contract.
    name: Parity harness (Python and Rust processes)
    needs: [python, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap patched Rustup with verified OS trust
        working-directory: .
        run: python3 scripts/ci_rustup.py
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          rustup toolchain install
          rustc --version
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync
      - name: Release build
        working-directory: rust
        run: cargo build --release --locked
      - name: The harness also runs with the host's python3 (shadow, PLAN.md 10.1)
        run: |
          python3 --version
          python3 -m py_compile rust/parity/*.py
      - name: Parity harness
        run: |
          timeout 300 uv run python rust/parity/run_parity.py --report "$RUNNER_TEMP/parity.json"
      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/parity.json" ]; then
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); r.pop("cases"); print(json.dumps(r, indent=1))' \
              "$RUNNER_TEMP/parity.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
