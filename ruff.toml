target-version = "py314"
# The parity harness also runs with a host's bare python3 (PLAN.md 10.1).
per-file-target-version = { "rust/parity/*.py" = "py312" }
line-length = 100
src = ["src", "tests"]

[lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "S",
    "N",
    "RUF",
]
ignore = [
    "S101",
]

[lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[format]
quote-style = "double"
