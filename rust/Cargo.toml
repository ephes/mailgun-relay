[package]
name = "mailgun-relay"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ephes/mailgun-relay"
description = "Mailgun send API adapter for Anymail, submitting over SMTP (Rust port)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
email-encoding = "0.4"
getrandom = "0.4"
http-body-util = "0.1"
idna = "1"
# `rustls-native-certs` is an implicit feature of lettre's optional
# dependency: the system roots (PLAN.md 5, S1b).
lettre = { version = "=0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "rustls-native-certs",
    "ring",
    "hostname",
] }
rustls-pki-types = "1"
regex = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
socket2 = "0.6"
subtle = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "macros", "io-util"] }
tokio-io-timeout = "1.2"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
mail-parser = "0.11"
rcgen = "0.14"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"

# opt-level "s" measured in S1 (PLAN.md 5): 1.58 MB and 2.6 MiB idle RSS
# against 1.77 MB and 2.9 MiB for opt-level 3; S5 re-measures with TLS.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
