[package]
name = "mailgun-relay"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ephes/mailgun-relay"
description = "Mailgun send API adapter for Anymail, submitting over SMTP (Rust port)"
publish = false

[dependencies]
idna = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
