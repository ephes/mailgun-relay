# cargo-deny policy for the Rust port (PLAN.md R7, section 8): run by the CI
# `rust` job. Only the release target is checked. A new license needs a
# deliberate addition here; advisories (RustSec) and yanked crates fail the
# check; crates come from crates.io only. Later slices add the licenses their
# crates bring (S5: ISC for `ring`).
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
